<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivansh's Birthday Race Day!</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Bungee', 'Rubik', sans-serif;
            background-color: #FF0000;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Checkered Flag Borders */
        body::before,
        body::after {
            content: '';
            position: fixed;
            left: 0;
            width: 100%;
            height: 50px;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    #000 0px,
                    #000 25px,
                    #fff 25px,
                    #fff 50px
                );
            z-index: 1000;
        }

        body::before {
            top: 0;
        }

        body::after {
            bottom: 0;
        }

        /* Racing Track Background */
        .race-track {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(255, 0, 0, 0.1), rgba(255, 215, 0, 0.1)),
                url('https://images.unsplash.com/photo-1446941303922-6a426bb5877b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1770&q=80') center/cover no-repeat,
                repeating-linear-gradient(
                    90deg,
                    #333 0px,
                    #333 40px,
                    #fff 40px,
                    #fff 80px
                );
            opacity: 0.15;
            z-index: -2;
            animation: trackMove 20s linear infinite;
        }

        @keyframes trackMove {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* Speed Lines Background */
        .speed-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .speed-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            animation: speedLine 3s linear infinite;
        }

        @keyframes speedLine {
            0% {
                transform: translateX(-100%);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* Container - Racing Track Shape */
        .container {
            width: 90%;
            max-width: 800px;
            min-height: 500px;
            margin: 70px auto;
            padding: 40px;
            position: relative;
            z-index: 1;
            background-color: #000000;
            border: 5px solid #FFD700;
            border-radius: 40px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Main Content Layout */
        .main-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 400px;
            position: relative;
        }

        .left-section {
            flex: 1;
            text-align: left;
            padding: 20px;
        }

        .center-section {
            flex: 1;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .right-section {
            flex: 1;
            text-align: right;
            padding: 20px;
        }

        .race-car {
            position: absolute;
            top: 20px;
            left: -100px;
            font-size: 60px;
            animation: raceCar 8s linear infinite;
            z-index: 2;
        }

        .race-car-2 {
            position: absolute;
            top: 80px;
            right: -100px;
            font-size: 50px;
            animation: raceCarReverse 10s linear infinite;
            z-index: 2;
        }

        @keyframes raceCar {
            0% {
                left: -100px;
                transform: scaleX(1);
            }
            49% {
                transform: scaleX(1);
            }
            50% {
                left: calc(100% + 100px);
                transform: scaleX(-1);
            }
            99% {
                transform: scaleX(-1);
            }
            100% {
                left: -100px;
                transform: scaleX(1);
            }
        }

        @keyframes raceCarReverse {
            0% {
                right: -100px;
                transform: scaleX(-1);
            }
            49% {
                transform: scaleX(-1);
            }
            50% {
                right: calc(100% + 100px);
                transform: scaleX(1);
            }
            99% {
                transform: scaleX(1);
            }
            100% {
                right: -100px;
                transform: scaleX(-1);
            }
        }

        /* Text Styling */
        .start-engine {
            font-family: 'Bungee', cursive;
            font-size: 1.5rem;
            color: #FFFFFF;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .birthday-name {
            font-family: 'Bungee', cursive;
            font-size: 3rem;
            color: #808080;
            text-shadow: 2px 2px 0px #FFD700, -1px -1px 0px #FFD700, 1px -1px 0px #FFD700, -1px 1px 0px #FFD700, 1px 1px 0px #FFD700;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .turning-age {
            font-family: 'Bungee', cursive;
            font-size: 2rem;
            color: #FFFFFF;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .date-info {
            font-family: 'Bungee', cursive;
        }

        .saturday {
            font-size: 1.2rem;
            color: #FFFFFF;
            margin-bottom: 5px;
        }

        .month {
            font-size: 1.5rem;
            color: #FF0000;
            margin-bottom: 5px;
        }

        .day {
            font-size: 2.5rem;
            color: #FFD700;
            margin-bottom: 10px;
        }

        .time {
            font-size: 1rem;
            color: #FFFFFF;
        }

        .location-info {
            font-family: 'Bungee', cursive;
        }

        .venue-name {
            font-size: 1.2rem;
            color: #FFFFFF;
            margin-bottom: 5px;
        }

        .address {
            font-size: 0.9rem;
            color: #FFFFFF;
            margin-bottom: 10px;
        }

        .rsvp-text {
            font-size: 1.2rem;
            color: #FFD700;
            margin-bottom: 5px;
        }

        .contact {
            font-size: 0.9rem;
            color: #FFFFFF;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .checkered-flag {
            font-size: 40px;
            animation: wave 1s ease-in-out infinite;
            display: inline-block;
            margin: 0 10px;
        }

        @keyframes wave {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        /* Date Section */
        .date-section {
            text-align: center;
            margin: 30px 0;
            padding: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #FFD700;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .date-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 255, 255, 0.1) 10px,
                rgba(255, 255, 255, 0.1) 20px
            );
            animation: slide 20s linear infinite;
        }

        @keyframes slide {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .date-title {
            font-family: 'Bungee', cursive;
            font-size: 2rem;
            color: #FFFFFF;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .date-display {
            font-size: 3rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            position: relative;
            z-index: 1;
        }

        /* Form Section */
        .form-section {
            background: 
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.7)),
                url('https://images.unsplash.com/photo-1617654112368-ac309c869557?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80') center/cover no-repeat;
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            box-shadow: 0 20px 40px rgba(255,0,0,0.4);
            position: relative;
            overflow: hidden;
            border: 3px solid #FF0000;
        }

        .form-section::before {
            content: '🏁';
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 100px;
            opacity: 0.1;
            transform: rotate(-15deg);
        }

        .form-title {
            font-family: 'Bungee', cursive;
            font-size: 2rem;
            color: #FFD700;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 10px;
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 3px solid #FFD700;
            border-radius: 10px;
            font-size: 1.1rem;
            font-family: 'Rubik', sans-serif;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.7);
            color: #FFD700;
        }

        .form-input:focus {
            outline: none;
            border-color: #FF0000;
            box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.4);
            transform: translateY(-2px);
            background: rgba(0, 0, 0, 0.8);
        }

        .form-input.error {
            border-color: #ff4444;
            animation: shake 0.5s;
        }

        .form-input::placeholder {
            color: rgba(255, 215, 0, 0.6);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* RSVP Buttons */
        .rsvp-buttons {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .rsvp-btn {
            flex: 1;
            min-width: 200px;
            padding: 20px 30px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Bungee', cursive;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        .rsvp-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .rsvp-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .rsvp-yes {
            background: linear-gradient(135deg, #00C851, #00ff00);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 200, 81, 0.3);
        }

        .rsvp-yes:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 200, 81, 0.4);
        }

        .rsvp-no {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 68, 68, 0.3);
        }

        .rsvp-no:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 68, 68, 0.4);
        }

        .rsvp-btn.selected {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #FF0000, #cc0000);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 900;
            font-family: 'Bungee', cursive;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .submit-btn::before {
            content: '🏁';
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn.loading {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            animation: loading 1.5s ease-in-out infinite;
        }

        @keyframes loading {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        /* Messages */
        .message {
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-weight: 700;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: linear-gradient(135deg, #00C851, #00ff00);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 200, 81, 0.3);
        }

        .message.error {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 68, 68, 0.3);
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #FFD700;
            position: absolute;
            animation: confetti-fall 3s linear;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .form-section {
                padding: 20px;
            }

            .rsvp-buttons {
                flex-direction: column;
            }

            .rsvp-btn {
                width: 100%;
            }

            .title {
                font-size: 2rem;
            }

            .date-display {
                font-size: 2rem;
            }

            .race-car {
                font-size: 40px;
            }
        }

        /* Tire Marks */
        .tire-mark {
            position: absolute;
            width: 80px;
            height: 20px;
            background: repeating-linear-gradient(
                90deg,
                #000 0px,
                #000 5px,
                transparent 5px,
                transparent 10px
            );
            opacity: 0.3;
            transform: rotate(-5deg);
        }

        .tire-mark-1 {
            top: 20%;
            left: 10%;
        }

        .tire-mark-2 {
            bottom: 30%;
            right: 15%;
            transform: rotate(5deg);
        }
    </style>
</head>
<body>
    <!-- Racing Track Background -->
    <div class="race-track"></div>
    
    <!-- Speed Lines -->
    <div class="speed-lines" id="speedLines"></div>

    <!-- Container -->
    <div class="container">
        <!-- Top Section -->
        <div class="top-section">
            <div class="race-car">🏎️</div>
            <div class="race-car-2">🏁</div>
            <div style="text-align: center; position: relative;">
                <div class="checkered-flag" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%);">🏁</div>
                <div class="start-engine">START YOUR ENGINE</div>
                <div class="birthday-name">RIVANSH'S</div>
                <div class="turning-age">IS TURNING 1</div>
                <div class="checkered-flag" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%);">🏁</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Section - Date/Time -->
            <div class="left-section">
                <div class="date-info">
                    <div class="saturday">Saturday</div>
                    <div class="month">MARCH</div>
                    <div class="day">26</div>
                    <div class="time">2:00 PM - 4:00 PM</div>
                </div>
            </div>

            <!-- Center Section - Car -->
            <div class="center-section">
                <div style="font-size: 120px; color: #FF0000; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
                    �️
                </div>
                <!-- Ferrari Logo -->
                <div style="position: absolute; top: 10px; left: 10px; background: #FFD700; width: 30px; height: 40px; border-radius: 5px; display: flex; align-items: center; justify-content: center;">
                    <div style="color: #000; font-size: 20px; font-weight: bold;">🐴</div>
                </div>
            </div>

            <!-- Right Section - Location -->
            <div class="right-section">
                <div class="location-info">
                    <div class="venue-name">Wesley Chapel District Park</div>
                    <div class="address">2727 Boyette Rd, Wesley Chapel, FL 33544</div>
                    <div class="rsvp-text">RSVP</div>
                    <div class="contact">To My Mom 123-123-123</div>
                </div>
            </div>
        </div>

        <!-- Bottom Section - Form -->
        <div class="bottom-section">
            <form id="rsvpForm" style="background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; border: 2px solid #FFD700;">
                <div style="display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap;">
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Enter your name"
                        required
                        style="padding: 10px 15px; border: 2px solid #FFD700; border-radius: 5px; background: rgba(0,0,0,0.7); color: #FFD700; font-family: 'Bungee', cursive;"
                    >
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="rsvp-btn rsvp-yes" data-rsvp="yes" style="padding: 10px 20px; border: none; border-radius: 5px; background: #00C851; color: white; font-family: 'Bungee', cursive; cursor: pointer;">
                            YES - I'll be there!
                        </button>
                        <button type="button" class="rsvp-btn rsvp-no" data-rsvp="no" style="padding: 10px 20px; border: none; border-radius: 5px; background: #ff4444; color: white; font-family: 'Bungee', cursive; cursor: pointer;">
                            NO - Can't make it
                        </button>
                    </div>
                    <button type="submit" style="padding: 10px 30px; border: none; border-radius: 5px; background: #FF0000; color: white; font-family: 'Bungee', cursive; cursor: pointer;">
                        Submit RSVP
                    </button>
                </div>
            </form>
            <div id="messageContainer"></div>
        </div>

        <!-- Footer -->
        <div style="text-align: center; margin-top: 20px; color: #FFFFFF; font-size: 0.8rem;">
            DESIGN BY RIVANSH'S BIRTHDAY TEAM
        </div>
    </div>

    <script>
        // Configuration - UPDATE THESE VALUES
        const CONFIG = {
            // Google Apps Script Web App URL
            // Replace this with your deployed Google Apps Script URL
            GOOGLE_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycby_RHwPtwE3bVnK5_SpngLlakMpzENw05mGJ0sc2I3iUKriIqgQcsZnWrERAYkiiVVS/exec',
            
            // Your Google Sheet ID (extracted from the URL)
            SHEET_ID: '1Ryk3N3HhL3Q4cBGKOeZayZxfu6579PEzfiU6tcRzZ3c',
            
            // Alternative: Google Sheets API (more complex setup)
            // API_KEY: 'YOUR_API_KEY'
        };

        // Form state
        let selectedRSVP = null;
        let isSubmitting = false;

        // Initialize speed lines
        function createSpeedLines() {
            const speedLinesContainer = document.getElementById('speedLines');
            const numberOfLines = 15;
            
            for (let i = 0; i < numberOfLines; i++) {
                const line = document.createElement('div');
                line.className = 'speed-line';
                line.style.top = Math.random() * 100 + '%';
                line.style.left = Math.random() * 100 + '%';
                line.style.width = Math.random() * 200 + 100 + 'px';
                line.style.animationDelay = Math.random() * 3 + 's';
                line.style.animationDuration = (Math.random() * 3 + 2) + 's';
                speedLinesContainer.appendChild(line);
            }
        }

        // RSVP button selection
        document.querySelectorAll('.rsvp-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove selected class from all buttons
                document.querySelectorAll('.rsvp-btn').forEach(b => b.classList.remove('selected'));
                
                // Add selected class to clicked button
                this.classList.add('selected');
                selectedRSVP = this.dataset.rsvp;
            });
        });

        // Form validation
        function validateForm() {
            const nameInput = document.getElementById('name');
            const name = nameInput.value.trim();
            
            // Reset error states
            nameInput.classList.remove('error');
            
            let isValid = true;
            let errorMessage = '';
            
            if (!name) {
                nameInput.classList.add('error');
                errorMessage = 'Please enter your name!';
                isValid = false;
            } else if (name.length < 2) {
                nameInput.classList.add('error');
                errorMessage = 'Name must be at least 2 characters long!';
                isValid = false;
            } else if (!selectedRSVP) {
                errorMessage = 'Please select whether you can attend or not!';
                isValid = false;
            }
            
            return { isValid, errorMessage };
        }

        // Show message
        function showMessage(message, type) {
            const messageContainer = document.getElementById('messageContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            
            messageContainer.innerHTML = '';
            messageContainer.appendChild(messageDiv);
            
            // Auto-remove message after 5 seconds
            setTimeout(() => {
                if (messageDiv.parentNode) {
                    messageDiv.remove();
                }
            }, 5000);
        }

        // Create confetti effect
        function createConfetti() {
            const colors = ['#FF0000', '#FFD700', '#00C851', '#FF69B4', '#00BFFF'];
            const confettiCount = 50;
            
            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);
                    
                    // Remove confetti after animation
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // Submit to Google Sheets
        async function submitToGoogleSheets(data) {
            try {
                console.log('Submitting data:', data);
                
                // Use the no-cors approach for Google Apps Script
                const response = await fetch(CONFIG.GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                    mode: 'no-cors' // Required for Google Apps Script
                });
                
                console.log('Request sent (no-cors mode)');
                
                // With no-cors, we can't read the response, but if no error was thrown, assume success
                return { success: true };
                
            } catch (error) {
                console.error('Error submitting to Google Sheets:', error);
                
                // Fallback: Store in localStorage as backup
                const existingData = JSON.parse(localStorage.getItem('rsvpBackup') || '[]');
                existingData.push(data);
                localStorage.setItem('rsvpBackup', JSON.stringify(existingData));
                console.log('Data saved to localStorage backup:', data);
                
                return { 
                    success: false, 
                    error: error.message,
                    fallbackUsed: true 
                };
            }
        }

        // Handle form submission
        document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (isSubmitting) return;
            
            const validation = validateForm();
            if (!validation.isValid) {
                showMessage(validation.errorMessage, 'error');
                return;
            }
            
            const name = document.getElementById('name').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            // Show loading state
            isSubmitting = true;
            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'Submitting...';
            
            // Prepare data
            const formData = {
                name: name,
                rsvp: selectedRSVP,
                timestamp: new Date().toISOString(),
                date: new Date().toLocaleDateString()
            };
            
            try {
                // Submit to Google Sheets
                const result = await submitToGoogleSheets(formData);
                
                if (result.success || result.fallbackUsed) {
                    // Success
                    let successMessage = `🏁 Thanks for your RSVP, ${name}! `;
                    
                    if (selectedRSVP === 'yes') {
                        successMessage += 'See you at the races! 🏆';
                        createConfetti();
                    } else {
                        successMessage += 'Thanks for letting us know! 🚗';
                    }
                    
                    if (result.fallbackUsed) {
                        successMessage += ' (Saved locally - will sync when online)';
                    }
                    
                    showMessage(successMessage, 'success');
                    
                    // Reset form
                    document.getElementById('rsvpForm').reset();
                    document.querySelectorAll('.rsvp-btn').forEach(btn => btn.classList.remove('selected'));
                    selectedRSVP = null;
                    
                } else {
                    throw new Error(result.error);
                }
                
            } catch (error) {
                console.error('Submission error:', error);
                showMessage('🚫 Sorry, there was an error submitting your RSVP. Please try again!', 'error');
            } finally {
                // Reset loading state
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitBtn.textContent = 'Submit RSVP';
            }
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            createSpeedLines();
            
            // Check if there's a configuration issue
            if (CONFIG.GOOGLE_SCRIPT_URL.includes('YOUR_SCRIPT_ID_HERE')) {
                showMessage('⚠️ Google Apps Script not configured yet. Form will save locally for testing. Setup instructions in HTML comments.', 'error');
            }
        });

        // Prevent form resubmission on page refresh
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
    </script>
